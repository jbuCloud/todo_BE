spring:
  datasource:
    url: jdbc:h2:file:~/newdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true         # ✅ H2 콘솔 사용 설정
      path: /h2-console     # ✅ 기본 경로 (선택적 명시)

logging:
  level:
    org.hibernate.SQL: debug

kakao:
  client-id: 52c4872fc30d423c710bb20bb07f874e
  redirect-uri: http://localhost:3000/callback

server:
  address: 0.0.0.0
  port: 8080
